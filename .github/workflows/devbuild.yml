name: Dev Build

on:
  push:
    branches: [ dev ]
    paths: [ '**/src/**' ]

jobs:
  deploy:
    uses: magemonkeystudio/.github/.github/workflows/reusable-build.yml@main
    secrets: inherit
    with:
      is_dev: true
      maven_args: '-DskipNms'
      java_version: '25'
      artifact_filter: 'codex'
